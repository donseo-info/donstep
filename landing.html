<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Лендинг вебинара — Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ========== Base ========== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Manrope", system-ui, sans-serif;
    background: #060912;
    color: #e7ecf5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ========== Theme variables ========== */
  .hero-theme-dark {
    --bg-1: #060912;
    --bg-2: #0b1226;
    --bg-card: rgba(255,255,255,0.04);
    --bg-card-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --fg: #e7ecf5;
    --fg-muted: #94a0b8;
    --fg-dim: #6b7691;
  }
  .hero-theme-midnight {
    --bg-1: #02050d;
    --bg-2: #050b1f;
    --bg-card: rgba(99, 130, 200, 0.06);
    --bg-card-hover: rgba(99, 130, 200, 0.10);
    --border: rgba(99, 130, 200, 0.14);
    --border-strong: rgba(99, 130, 200, 0.24);
    --fg: #eef3ff;
    --fg-muted: #8597b8;
    --fg-dim: #5a6986;
  }
  .hero-theme-light {
    --bg-1: #f5f6fa;
    --bg-2: #e9edf6;
    --bg-card: #ffffff;
    --bg-card-hover: #ffffff;
    --border: rgba(20, 30, 60, 0.08);
    --border-strong: rgba(20, 30, 60, 0.16);
    --fg: #0d1426;
    --fg-muted: #4d5a78;
    --fg-dim: #7a869f;
  }


  /* ========== Hero shell ========== */
  .hero {
    position: relative;
    min-height: 100vh;
    padding: 24px clamp(20px, 4vw, 64px) 64px;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color: var(--fg);
    overflow: hidden;
  }

  .hero-bg {
    position: absolute; inset: 0; pointer-events: none;
    z-index: 0;
  }
  .hero-bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.7;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .hero-bg-orb-1 {
    width: 720px; height: 720px;
    top: -200px; right: -160px;
  }
  .hero-bg-orb-2 {
    width: 560px; height: 560px;
    bottom: -240px; left: -180px;
    background: radial-gradient(circle, oklch(0.55 0.14 280 / 0.5), transparent 65%);
  }
  .hero-theme-light .hero-bg-orb { opacity: 0.35; }
  .hero-bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 80%);
    opacity: 0.4;
  }

  /* ========== Nav ========== */
  .hero-nav {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 48px;
    padding: 8px 0 0;
    max-width: 1440px;
    margin: 0 auto 56px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: grid; place-items: center;
    color: #061026;
    font-family: "Unbounded", "Manrope", sans-serif;
    font-weight: 800;
    font-size: 18px;
    box-shadow: 0 6px 22px -4px var(--accent);
  }
  .brand-name {
    font-family: "Unbounded", "Manrope", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }
  .nav-links {
    display: flex; gap: 32px;
    margin-left: 24px;
  }
  .nav-links a {
    color: var(--fg-muted);
    font-size: 15px;
    font-weight: 500;
    transition: color 0.18s;
  }
  .nav-links a:hover { color: var(--fg); }
  .nav-login { display: none; }

  /* ========== Contact widget ========== */
  .contact-widget {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 8px 16px 8px 8px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg-card);
    backdrop-filter: blur(8px);
  }
  .rating-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-right: 16px;
    border-right: 1px solid var(--border);
  }
  .rating-mark {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: #fc3f1d;
    color: #fff;
    display: grid; place-items: center;
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 17px;
    flex-shrink: 0;
  }
  .rating-body {
    line-height: 1.1;
  }
  .rating-place {
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-muted);
    margin-bottom: 2px;
  }
  .rating-stars {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stars {
    color: #ffb800;
    font-size: 12px;
    letter-spacing: -0.5px;
  }
  .rating-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--fg);
  }
  .phone-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.15;
    gap: 2px;
  }
  .phone-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--fg-muted);
  }
  .phone-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
  }
  .phone-num {
    font-family: "Manrope", sans-serif;
    font-size: 19px;
    font-weight: 800;
    color: var(--fg);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .phone-cta {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 1px solid var(--accent-border);
    padding: 0 0 1px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    font-family: inherit;
    transition: color 0.18s, border-color 0.18s;
  }
  .phone-cta:hover {
    color: var(--fg);
    border-color: var(--accent);
  }

  /* ========== Grid ========== */
  .hero-grid {
    position: relative; z-index: 1;
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: clamp(32px, 5vw, 72px);
    align-items: center;
  }
  .hero-layout-centered .hero-grid {
    grid-template-columns: 1fr;
    text-align: center;
    max-width: 980px;
  }
  .hero-layout-centered .hero-pills,
  .hero-layout-centered .features-row,
  .hero-layout-centered .hero-cta-row {
    justify-content: center;
  }
  .hero-layout-centered .hero-visual {
    margin: 32px auto 0;
    max-width: 720px;
  }
  .hero-layout-overlay .hero-grid {
    grid-template-columns: 1fr;
    position: static;
  }
  .hero-layout-overlay .hero-content {
    position: relative;
    z-index: 2;
    max-width: 56%;
  }
  .hero-layout-overlay .feature-card,
  .hero-layout-overlay .speaker-line,
  .hero-layout-overlay .countdown {
    background: rgba(7, 12, 28, 0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-color: var(--border-strong);
  }
  @media (max-width: 1100px) {
    .hero-layout-overlay .hero-content { max-width: 100%; }
  }
  .hero-layout-overlay .hero-visual {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: min(58%, 1000px);
    z-index: 0;
    pointer-events: none;
  }
  .hero-layout-overlay .speaker-frame-bg {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    aspect-ratio: auto;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 100%);
  }
  .hero-layout-overlay .speaker-frame-bg .speaker-img {
    object-position: right center;
    object-fit: cover;
  }
  .hero-layout-overlay .hero-content {
    position: relative;
    z-index: 2;
    max-width: 820px;
  }

  /* ========== Pills ========== */
  .hero-pills {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    backdrop-filter: blur(6px);
  }
  .pill-free {
    border-color: var(--accent-border);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .pulse-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 oklch(from var(--accent) l c h / 0.5); }
    70% { box-shadow: 0 0 0 8px oklch(from var(--accent) l c h / 0); }
    100% { box-shadow: 0 0 0 0 oklch(from var(--accent) l c h / 0); }
  }

  /* ========== Title ========== */
  .hero-title {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 5.4vw, 72px);
    line-height: 1.04;
    letter-spacing: -0.03em;
    margin: 0 0 22px;
    text-wrap: balance;
  }
  .title-line { display: block; }
  .title-accent { color: var(--accent); }

  .hero-heading-display .hero-title {
    font-family: "Unbounded", "Manrope", sans-serif;
    font-weight: 700;
    letter-spacing: -0.025em;
    font-size: clamp(38px, 5vw, 66px);
  }
  .hero-heading-mono .hero-title {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: clamp(32px, 4.2vw, 56px);
    letter-spacing: -0.02em;
  }

  .hero-sub {
    font-size: clamp(16px, 1.3vw, 19px);
    line-height: 1.45;
    color: var(--fg-muted);
    max-width: 560px;
    margin: 0 0 36px;
  }
  .hero-layout-centered .hero-sub { margin-left: auto; margin-right: auto; }

  /* ========== Features ========== */
  .features-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 36px;
  }
  .feature-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1),
                background 0.2s,
                border-color 0.2s,
                box-shadow 0.25s;
    cursor: default;
    will-change: transform;
  }
  .feature-card.is-hovered {
    transform: translateY(-3px);
    background: var(--bg-card-hover);
    border-color: var(--accent-border);
    box-shadow: 0 14px 40px -16px var(--accent),
                inset 0 0 0 1px var(--accent-border);
  }
  .feature-card[data-density="compact"] {
    padding: 12px 14px;
    gap: 10px;
  }
  .feature-icon {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    transition: transform 0.25s;
  }
  .feature-icon svg { width: 22px; height: 22px; }
  .feature-card.is-hovered .feature-icon { transform: scale(1.06) rotate(-3deg); }
  .feature-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 3px;
    letter-spacing: -0.005em;
  }
  .feature-body {
    font-size: 12.5px;
    line-height: 1.35;
    color: var(--fg-muted);
  }

  /* ========== CTA row ========== */
  .hero-cta-row {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    border: none;
    border-radius: 14px;
    color: #061026;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 14px 32px -10px var(--accent);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 18px 40px -10px var(--accent);
  }
  .btn-primary svg { transition: transform 0.18s; }
  .btn-primary:hover svg { transform: translateX(3px); }

  .speaker-line {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px 8px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card);
  }
  .speaker-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid var(--border-strong);
  }
  .speaker-name {
    display: flex; align-items: center; gap: 6px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .speaker-name svg { color: var(--fg-muted); width: 13px; height: 13px; }
  .speaker-role {
    font-size: 11.5px;
    color: var(--fg-muted);
    margin-top: 1px;
  }

  /* ========== Countdown ========== */
  .countdown {
    margin-top: 8px;
    padding: 16px 20px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    display: inline-flex;
    align-items: center;
    gap: 20px;
  }
  .countdown-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .countdown-cells {
    display: flex; gap: 16px;
  }
  .countdown-cell {
    text-align: center;
    min-width: 48px;
  }
  .countdown-num {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 24px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .countdown-unit {
    font-size: 10.5px;
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  /* ========== Hero visual / speaker frame ========== */
  .hero-visual {
    position: relative;
    will-change: transform;
  }
  .hero-visual-inner {
    width: 100%;
    height: 100%;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .speaker-frame {
    position: relative;
    aspect-ratio: 5 / 5.4;
    border-radius: 24px;
    overflow: hidden;
    background: linear-gradient(180deg, #0d1731, #060c1c);
    border: 1px solid var(--border-strong);
    box-shadow:
      0 30px 80px -30px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .speaker-glow {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .speaker-photo-wrap {
    position: absolute; inset: 0;
    overflow: hidden;
  }
  .speaker-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 18%;
    display: block;
  }
  .speaker-photo-fade {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, transparent 60%, rgba(5, 11, 31, 0.55) 100%),
      linear-gradient(90deg, rgba(5, 11, 31, 0.35) 0%, transparent 35%);
  }
  .speaker-frame-bg .speaker-photo-fade {
    background:
      linear-gradient(180deg, transparent 75%, rgba(5, 11, 31, 0.6) 100%),
      linear-gradient(90deg, rgba(5, 11, 31, 0.92) 0%, rgba(5, 11, 31, 0.4) 22%, transparent 50%);
  }
  .float-tile {
    position: absolute;
    background: rgba(11, 18, 38, 0.9);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    z-index: 2;
    box-shadow: 0 12px 32px -10px rgba(0,0,0,0.5);
  }
  .float-tile-1 {
    top: 20px; left: 20px;
    width: 140px;
    padding: 12px;
    animation: float 6s ease-in-out infinite;
  }
  .float-tile-2 {
    top: 40px; right: 22px;
    width: 56px; height: 56px;
    display: grid; place-items: center;
    animation: float 7s ease-in-out infinite -2s;
  }
  .float-tile-3 {
    bottom: 80px; right: 28px;
    width: 56px; height: 56px;
    display: grid; place-items: center;
    animation: float 5.5s ease-in-out infinite -1s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .tile-dots {
    display: flex; gap: 5px;
    margin-bottom: 8px;
  }
  .tile-dots span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }
  .tile-dots span:first-child { background: #ff5f57; }
  .tile-dots span:nth-child(2) { background: #ffbd2e; }
  .tile-dots span:nth-child(3) { background: #28c840; }
  .tile-lines { display: flex; flex-direction: column; gap: 4px; }
  .tile-line {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
  }
  .tile-line:nth-child(2) { background: var(--accent-soft); }
  .tile-line:nth-child(3) { background: rgba(255,255,255,0.18); }



  /* ========== Reveal animation ========== */
  .reveal {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.7s cubic-bezier(.2,.8,.2,1) var(--reveal-delay, 0ms),
                transform 0.7s cubic-bezier(.2,.8,.2,1) var(--reveal-delay, 0ms);
  }
  .hero.is-mounted .reveal {
    opacity: 1;
    transform: translateY(0);
  }

  /* ========== Responsive ========== */
  @media (max-width: 1100px) {
    .hero-grid { grid-template-columns: 1fr; }
    .hero-visual { max-width: 560px; margin: 16px auto 0; }
    .hero-nav { gap: 16px; }
    .nav-links { display: none; }
    .contact-widget {
      gap: 12px;
      padding: 6px 14px 6px 6px;
    }
    .rating-badge { padding-right: 12px; gap: 8px; }
    .rating-mark { width: 28px; height: 28px; font-size: 14px; }
    .phone-num { font-size: 17px; }

    /* Overlay → stacked on tablets / mobile */
    .hero-layout-overlay .hero-visual {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: auto;
      aspect-ratio: 16 / 11;
      margin: 0 0 24px;
      order: -1;
    }
    .hero-layout-overlay .speaker-frame-bg {
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%);
              mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%);
    }
    .hero-layout-overlay .speaker-frame-bg .speaker-photo-fade {
      background:
        linear-gradient(180deg, transparent 50%, rgba(5, 11, 31, 0.85) 100%),
        linear-gradient(90deg, transparent 0%, transparent 100%);
    }
    .hero-layout-overlay .speaker-frame-bg .speaker-img {
      object-position: center 25%;
    }
    .hero-layout-overlay .hero-content {
      max-width: 100%;
    }
    .hero-layout-overlay .hero-grid {
      display: flex;
      flex-direction: column;
    }
  }
  @media (max-width: 720px) {
    .hero { padding: 20px 16px 48px; }
    .hero-nav { margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .nav-login { padding: 8px 14px; font-size: 13px; }
    .contact-widget {
      width: 100%;
      order: 3;
      justify-content: space-between;
      padding: 8px 12px 8px 8px;
      gap: 10px;
    }
    .rating-badge { padding-right: 10px; gap: 8px; }
    .rating-mark { width: 30px; height: 30px; font-size: 15px; }
    .rating-place { font-size: 11px; }
    .stars { font-size: 11px; }
    .phone-status { display: none; }
    .phone-num { font-size: 15px; }
    .phone-cta { font-size: 11.5px; }
    .brand-name { font-size: 17px; }
    .features-row { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 28px; }
    .hero-title { font-size: 34px; line-height: 1.08; margin-bottom: 16px; }
    .hero-sub { font-size: 15px; margin-bottom: 24px; }
    .hero-pills { gap: 8px; margin-bottom: 20px; }
    .pill { padding: 7px 12px; font-size: 12.5px; }
    .hero-cta-row { gap: 12px; flex-direction: column; align-items: stretch; }
    .btn-primary { width: 100%; justify-content: center; padding: 14px 20px; }
    .speaker-line { width: 100%; }
    .countdown { width: 100%; }
    .countdown-cells { flex: 1; justify-content: space-between; }
    .float-tile-1 { width: 110px; padding: 8px; }
    .float-tile-1 .tile-dots span { width: 5px; height: 5px; }

    .hero-layout-overlay .hero-visual {
      aspect-ratio: 4 / 3;
      margin: 0 -16px 20px;
      width: calc(100% + 32px);
    }
    .feature-card { padding: 12px; gap: 10px; }
    .feature-icon { width: 32px; height: 32px; }
    .feature-icon svg { width: 18px; height: 18px; }
    .feature-title { font-size: 13px; }
    .feature-body { font-size: 11.5px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="sections.css?v=3" />
  <link rel="stylesheet" href="quiz.css?v=5" />
  <link rel="stylesheet" href="consult.css" />

  <!-- Tweaks panel + components -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="quiz.jsx?v=2"></script>

  <script type="text/babel">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "midnight",
      "accentHue": 302,
      "layout": "overlay",
      "headingStyle": "bold",
      "density": "compact",
      "showCountdown": false,
      "parallax": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      const accent = `oklch(0.68 0.19 ${tweaks.accentHue})`;
      const accentSoft = `oklch(0.68 0.19 ${tweaks.accentHue} / 0.16)`;
      const accentBorder = `oklch(0.68 0.19 ${tweaks.accentHue} / 0.35)`;
      // Зеркалим CSS-переменные на корень страницы, чтобы новые секции
      // подхватывали тему и акцент. (Hero задаёт их у себя локально.)
      React.useEffect(() => {
        const root = document.documentElement;
        const themes = {
          dark:     { "--bg-1": "#060912", "--bg-2": "#0b1226", "--bg-card": "rgba(255,255,255,0.04)", "--bg-card-hover": "rgba(255,255,255,0.07)", "--border": "rgba(255,255,255,0.08)", "--border-strong": "rgba(255,255,255,0.14)", "--fg": "#e7ecf5", "--fg-muted": "#94a0b8", "--fg-dim": "#6b7691" },
          midnight: { "--bg-1": "#02050d", "--bg-2": "#050b1f", "--bg-card": "rgba(99,130,200,0.06)", "--bg-card-hover": "rgba(99,130,200,0.10)", "--border": "rgba(99,130,200,0.14)", "--border-strong": "rgba(99,130,200,0.24)", "--fg": "#eef3ff", "--fg-muted": "#8597b8", "--fg-dim": "#5a6986" },
          light:    { "--bg-1": "#f5f6fa", "--bg-2": "#e9edf6", "--bg-card": "#ffffff", "--bg-card-hover": "#ffffff", "--border": "rgba(20,30,60,0.08)", "--border-strong": "rgba(20,30,60,0.16)", "--fg": "#0d1426", "--fg-muted": "#4d5a78", "--fg-dim": "#7a869f" },
        };
        const t = themes[tweaks.theme] || themes.dark;
        Object.entries(t).forEach(([k, v]) => root.style.setProperty(k, v));
        root.style.setProperty("--accent", accent);
        root.style.setProperty("--accent-soft", accentSoft);
        root.style.setProperty("--accent-border", accentBorder);
        document.body.style.background = t["--bg-1"];
      }, [tweaks.theme, tweaks.accentHue]);

      const [consultOpen, setConsultOpen] = React.useState(false);
      React.useEffect(() => { window.__openConsult = () => setConsultOpen(true); }, []);

      return (
        <React.Fragment>
          <Hero tweaks={tweaks} />
          <ProgramSection />
          <QuizSection />
          <AudienceSection />
          <SpeakerSection />
          <BonusesSection />
          <FAQSection />
          <SignupSection />
          <Footer />
          <StickyCTA />
          {consultOpen && <ConsultModal onClose={() => setConsultOpen(false)} />}

          <TweaksPanel title="Tweaks">
            <TweakSection label="Тема" />
            <TweakRadio
              label="Theme"
              value={tweaks.theme}
              onChange={(v) => setTweak("theme", v)}
              options={[
                { value: "dark", label: "Dark" },
                { value: "midnight", label: "Midnight" },
                { value: "light", label: "Light" },
              ]}
            />

            <TweakSection label="Акцентный цвет" />
            <TweakSlider
              label="Hue"
              value={tweaks.accentHue}
              onChange={(v) => setTweak("accentHue", v)}
              min={0}
              max={360}
              step={1}
              unit="°"
            />
            <div style={{ display: "flex", gap: 6, padding: "4px 12px 8px" }}>
              {[250, 220, 190, 145, 30, 350, 310].map((h) => (
                <button
                  key={h}
                  onClick={() => setTweak("accentHue", h)}
                  style={{
                    width: 22, height: 22, borderRadius: 5,
                    border: tweaks.accentHue === h ? "2px solid #29261b" : "1px solid rgba(0,0,0,0.15)",
                    background: `oklch(0.68 0.19 ${h})`,
                    cursor: "pointer",
                    padding: 0,
                  }}
                  aria-label={`Hue ${h}`}
                />
              ))}
            </div>

            <TweakSection label="Композиция" />
            <TweakRadio
              label="Layout"
              value={tweaks.layout}
              onChange={(v) => setTweak("layout", v)}
              options={[
                { value: "split", label: "Split" },
                { value: "centered", label: "Centered" },
                { value: "overlay", label: "Overlay" },
              ]}
            />

            <TweakSection label="Типографика" />
            <TweakRadio
              label="Заголовок"
              value={tweaks.headingStyle}
              onChange={(v) => setTweak("headingStyle", v)}
              options={[
                { value: "bold", label: "Bold" },
                { value: "display", label: "Display" },
                { value: "mono", label: "Mono" },
              ]}
            />

            <TweakSection label="Плотность фич" />
            <TweakRadio
              label="Density"
              value={tweaks.density}
              onChange={(v) => setTweak("density", v)}
              options={[
                { value: "comfy", label: "Comfy" },
                { value: "compact", label: "Compact" },
              ]}
            />

            <TweakSection label="Опции" />
            <TweakToggle
              label="Обратный отсчёт"
              value={tweaks.showCountdown}
              onChange={(v) => setTweak("showCountdown", v)}
            />
            <TweakToggle
              label="Параллакс мыши"
              value={tweaks.parallax}
              onChange={(v) => setTweak("parallax", v)}
            />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
